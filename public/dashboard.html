<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow // Dashboard Workspace</title>
    
    <!-- Self-Contained Offline CSS UI Engine -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Top Bar styling */
        .nav-bar {
            background-color: #ffffff;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 2.5rem;
            height: 2.5rem;
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
        }

        .user-email {
            font-size: 0.875rem;
            font-weight: 700;
            color: #1e293b;
        }

        .logout-btn {
            background: none;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            color: #ef4444;
            background-color: #fef2f2;
            border-color: #fca5a5;
        }

        /* Workspace Card styling */
        .workspace-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
            padding: 2rem;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .workspace-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
        }

        .badge {
            background-color: #e0e7ff;
            color: #4f46e5;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }

        /* Task Form styling */
        .task-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .task-input:focus {
            border-color: #4f46e5;
            background-color: #ffffff;
        }

        .add-btn {
            background-color: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 0 1.25rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background-color: #4338ca;
        }

        /* Todo Rows List styling */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .task-row.completed {
            background-color: #f8fafc;
            border-color: #f1f5f9;
            opacity: 0.7;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            flex: 1;
            user-select: none;
        }

        .checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #cbd5e1;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .task-row.completed .checkbox {
            background-color: #10b981;
            border-color: #10b981;
        }

        .checkbox::after {
            content: "✓";
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 900;
            display: none;
        }

        .task-row.completed .checkbox::after {
            display: block;
        }

        .task-text {
            font-size: 0.925rem;
            font-weight: 500;
            color: #334155;
        }

        .task-row.completed .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .delete-btn:hover {
            color: #ef4444;
            background-color: #fef2f2;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 0;
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .task-error {
            color: #dc2626;
            font-size: 0.875rem;
            margin: 0.75rem 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Profile Navbar -->
        <div class="nav-bar">
            <div class="profile-section">
                <div class="avatar" id="avatar">U</div>
                <div>
                    <div class="user-email" id="user-display-email">User Workspace</div>
                </div>
            </div>
            <button onclick="handleLogout()" class="logout-btn">Sign Out</button>
        </div>

        <!-- Main Workspace -->
        <div class="workspace-card">
            <div class="workspace-header">
                <h2>Tasks Workspace</h2>
                <span class="badge" id="task-badge">0 Items</span>
            </div>

            <form id="task-form" class="task-form">
                <input type="text" id="task-input" placeholder="Plan your next task milestone..." required class="task-input">
                <button type="submit" class="add-btn">+</button>
            </form>

            <ul id="task-list" class="task-list"></ul>
        </div>
    </div>

    <script type="application/disabled">
        const token = localStorage.getItem('todo_token');
        // Instantly redirect back to login gateway index if unauthorized
        if (!token) window.location.href = '/';

        document.getElementById('user-display-email').innerText = localStorage.getItem('user_email') || 'Active Account';
        document.getElementById('avatar').innerText = (localStorage.getItem('user_email') || 'U').charAt(0).toUpperCase();

        const taskList = document.getElementById('task-list');
        const taskBadge = document.getElementById('task-badge');

        async function apiRequest(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
            const res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) handleLogout();
            return res;
        }

        async function loadTasks() {
            try {
                const res = await apiRequest('/api/todos');
                const data = await res.json();
                renderTasks(data);
            } catch (err) {
                console.error("Error reading dashboard tasks:", err);
            }
        }

        function renderTasks(tasks) {
            taskList.innerHTML = '';
            taskBadge.innerText = `${tasks.length} Task${tasks.length === 1 ? '' : 's'}`;

            if (tasks.length === 0) {
                taskList.innerHTML = `<div class="empty-state">No dashboard tasks found. Create one above!</div>`;
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-row ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${task.id})">
                        <div class="checkbox"></div>
                        <span class="task-text">${task.title}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="delete-btn">✕</button>
                `;
                taskList.appendChild(li);
            });
        }

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const title = input.value.trim();
            if (!title) return;

            try {
                const res = await apiRequest('/api/todos', {
                    method: 'POST',
                    body: JSON.stringify({ title })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Could not add task.');

                input.value = '';
                await loadTasks();
            } catch (err) {
                const error = document.createElement('p');
                error.className = 'task-error';
                error.innerText = err.message;
                document.querySelector('.task-form').after(error);
                setTimeout(() => error.remove(), 4000);
            }
        });
                async function toggleTask(id) {
                    await apiRequest(`/api/todos/${id}`, { method: 'PUT' });loadTasks();}async function deleteTask(id) {
                        await apiRequest(`/api/todos/${id}`, { method: 'DELETE' });loadTasks();}function handleLogout() {
                            localStorage.clear();window.location.href = '/';}loadTasks(); 
    </script>
    <script src="/dashboard.js"></script>
</body>
</html>
